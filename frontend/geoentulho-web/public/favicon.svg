<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fundo circular com cor primária do projeto -->
  <circle cx="50" cy="50" r="50" fill="#2D7A5B"/>
  
  <!-- Símbolo de reciclagem/resíduos -->
  <g transform="translate(50, 50)">
    <!-- Triângulo externo (reciclagem) -->
    <path d="M 0,-25 L 21.65,12.5 L -21.65,12.5 Z" fill="none" stroke="#F4B860" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Setas internas (movimento circular) -->
    <path d="M -8,-20 L -15,-20 L -12,-10" fill="none" stroke="#F4B860" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 15,15 L 20,10 L 18,20" fill="none" stroke="#F4B860" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -5,20 L -10,18 L -5,10" fill="none" stroke="#F4B860" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>